<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solitaire Klondike Game</title>
<link rel="icon" type="image/png" href="./favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<!-- ANALYTICS --> 
<script defer src="./bundle.min.js"></script>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="game-stats">
      <span class="stat-score"></span>
      <span class="stat-time"></span>
      <span class="stat-moves"></span>
    </div>
  </div>
  <div id="game-container"></div>
</div>
<script>function calculateTopBarPosition() {
            const topBar = document.querySelector('.top-bar');
            const topBarHeight = topBar.offsetHeight;
            const viewportHeight = window.innerHeight;
            const bottomPositionPercentage = (topBarHeight / viewportHeight) * 100;

            window.topBarBottomPosition = bottomPositionPercentage * window.innerHeight / 100;
        }

        window.addEventListener('load', calculateTopBarPosition);
        window.addEventListener('resize', calculateTopBarPosition);
        const intervalId = setInterval(calculateTopBarPosition, 5);</script>
</body>
</html>
