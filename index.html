<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solitär Kostenlos</title>
<link rel="icon" type="image/png" href="./favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<!-- ANALYTICS -->
<script defer src="./bundle.min.js"></script>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="game-stats">
      <span class="stat-score"></span>
      <span class="stat-time"></span>
    </div>
    <div class="brand">Solitär Kostenlos</div>
    <div class="game-links">
      <a href="/spider" class="game-link game-link-optional"><span>Spider</span></a>
      <a href="/freecell" class="game-link game-link-optional"><span>Freecell</span></a>
      <a href="/solitaire" class="game-link"><span>Solitaire</span></a>
      <a href="/mahjong" class="game-link"><span>Mahjong</span></a>
    </div>
  </div>
  <div id="game-container"></div>
</div>
<script>
    function calculateTopBarPosition() {
        const topBar = document.querySelector('.top-bar');
        if (!topBar) return;
        window.topBarBottomPosition = topBar.offsetHeight;
    }
    window.addEventListener('load', calculateTopBarPosition);
    window.addEventListener('resize', calculateTopBarPosition);
    setInterval(calculateTopBarPosition, 1000);
</script>
</body>
</html>
