<!doctype html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <title>Klondike</title>
</head>

<body>
    <div id="app">
        <div class="top-bar">
            <div class="title"></div>
            <div class="game-links">
                
                <!-- <a href="https://FREESOLITAIRE.com/solitaire" class="game-link" target="_blank"><span>Solitaire</span></a>
                <a href="https://FREESOLITAIRE.com/freecell" class="game-link" target="_blank"><span>FreeCell</span></a> -->
                <a href="/all-games" class="game-link" target="_blank"><span>All Games</span></a>
                <a href="/blog" class="game-link" target="_blank"><span>Blog</span></a>
            </div>
            
            
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        function adjustTitle() {
            const titleElement = document.querySelector('.title');
            if (window.innerWidth <= 750) {
                titleElement.textContent = 'SOLITAIRE';
            } else {
                titleElement.textContent = 'FREESOLITAIRE.COM - SOLITAIRE';
            }
        }

        function calculateTopBarPosition() {
            const topBar = document.querySelector('.top-bar');
            const topBarHeight = topBar.offsetHeight;
            const viewportHeight = window.innerHeight;
            const bottomPositionPercentage = (topBarHeight / viewportHeight) * 100;

            
            window.topBarBottomPosition = bottomPositionPercentage * window.innerHeight / 100;
        }
    
        // Run on initial load and window resize
        window.addEventListener('load', () => {
            adjustTitle();
            calculateTopBarPosition();
        });
        window.addEventListener('resize', () => {
            adjustTitle();
            calculateTopBarPosition();
        });
    </script>
    
</body>
</html>
